name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Fix icon.ico (convert from PNG)
        shell: pwsh
        run: |
          # Dùng magick (ImageMagick) để tạo .ico đúng chuẩn từ PNG
          choco install imagemagick -y --no-progress | Out-Null
          magick icon.png -define icon:auto-resize=256,128,64,48,32,16 icon.ico
      - run: npm ci
      - name: Build Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.exe
            dist/*.yml
          retention-days: 7

  build-linux:
    name: 🐧 Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg imagemagick
      - name: Fix icon.ico (convert from PNG)
        run: convert icon.png -define icon:auto-resize=256,128,64,48,32,16 icon.ico
      - run: npm ci
      - name: Build Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
          retention-days: 7

  build-macos:
    name: 🍎 macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Fix icon.ico (convert from PNG)
        run: |
          brew install imagemagick
          magick icon.png -define icon:auto-resize=256,128,64,48,32,16 icon.ico
      - run: npm ci
      - name: Build macOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            dist/*.dmg
            dist/*.yml
          retention-days: 7

  release:
    name: 🚀 Publish Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Dép Lào ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.dmg
          body: |
            ## 🩴 Dép Lào ${{ github.ref_name }}

            | Hệ điều hành | File | Ghi chú |
            |---|---|---|
            | 🪟 Windows | `*-Setup.exe` | Bản cài đặt |
            | 🪟 Windows | `*-Portable.exe` | Bản portable |
            | 🐧 Linux | `*.AppImage` | Chạy trực tiếp |
            | 🐧 Linux | `*.deb` | Ubuntu / Debian |
            | 🍎 macOS | `*.dmg` | Intel & Apple Silicon |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
