name: Build & Release

on:
  push:
    tags:
      - 'v*'        # Kích hoạt khi push tag kiểu v1.0.0
  workflow_dispatch:  # Cho phép chạy thủ công từ GitHub UI

permissions:
  contents: write   # Cần để tạo Release và upload artifacts

jobs:
  # ─────────────── BUILD WINDOWS ───────────────
  build-windows:
    name: 🪟 Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows (NSIS Installer + Portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.exe
            dist/*.yml
          retention-days: 7

  # ─────────────── BUILD LINUX ───────────────
  build-linux:
    name: 🐧 Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Linux (AppImage + deb)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
          retention-days: 7

  # ─────────────── BUILD MACOS ───────────────
  build-macos:
    name: 🍎 macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS (DMG - x64 & arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            dist/*.dmg
            dist/*.yml
          retention-days: 7

  # ─────────────── CREATE GITHUB RELEASE ───────────────
  release:
    name: 🚀 Publish Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Dép Lào ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.dmg
          body: |
            ## 🩴 Dép Lào ${{ github.ref_name }}

            ### 📥 Tải về theo hệ điều hành

            | Hệ điều hành | File | Ghi chú |
            |---|---|---|
            | 🪟 Windows | `*-Setup.exe` | Bản cài đặt (NSIS) |
            | 🪟 Windows | `*-Portable.exe` | Bản portable, không cần cài |
            | 🐧 Linux | `*.AppImage` | Chạy trực tiếp, không cài |
            | 🐧 Linux | `*.deb` | Dành cho Ubuntu/Debian |
            | 🍎 macOS | `*.dmg` | Hỗ trợ Intel (x64) & Apple Silicon (arm64) |

            ### 📌 Hướng dẫn cài đặt
            - **Windows**: Chạy file `.exe`, làm theo hướng dẫn
            - **Linux AppImage**: `chmod +x *.AppImage && ./*.AppImage`
            - **Linux deb**: `sudo dpkg -i *.deb`
            - **macOS**: Mở file `.dmg`, kéo app vào thư mục Applications
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
